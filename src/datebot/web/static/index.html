<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datebot</title>
<style>
  :root { --bg:#f6f5f3; --fg:#1d1d1f; --card:#fff; --muted:#6e6e73; --like:#1f9d55; --pass:#d64545; --line:#e3e1dd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#f2f2f2; --card:#1e1e1e; --muted:#9a9aa0; --line:#2e2e2e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  #stats { color:var(--muted); font-size:13px; }
  main { max-width:560px; margin:16px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .photo { position:relative; background:#000; aspect-ratio:3/4; }
  .photo img { width:100%; height:100%; object-fit:contain; display:block; }
  .nav { position:absolute; top:0; bottom:0; width:30%; border:0; background:transparent; cursor:pointer; }
  .nav.l { left:0; } .nav.r { right:0; }
  .dots { position:absolute; top:8px; left:0; right:0; display:flex; gap:4px; padding:0 8px; }
  .dots i { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.4); }
  .dots i.on { background:#fff; }
  .info { padding:12px 16px; }
  .info h2 { margin:0 0 4px; font-size:18px; }
  .info p { margin:4px 0 0; color:var(--muted); }
  .score { float:right; font-weight:600; padding:2px 10px; border-radius:99px; background:var(--bg); border:1px solid var(--line); }
  .actions { display:flex; gap:12px; margin:16px 0; }
  .actions button { flex:1; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:12px; color:#fff; cursor:pointer; }
  #pass { background:var(--pass); } #like { background:var(--like); }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button.sm, a.sm { padding:7px 12px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; cursor:pointer; font-size:13px; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .drop { margin-top:16px; padding:16px; border:2px dashed var(--line); border-radius:12px; text-align:center; color:var(--muted); }
  .drop.over { border-color:var(--like); color:var(--fg); }
  .drop input[type=text], .drop input[type=number] { padding:6px 8px; margin:4px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); width:130px; }
  details.filters { margin-top:16px; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  details.filters summary { cursor:pointer; font-weight:600; }
  details.filters label { display:block; margin:8px 0 2px; font-size:12px; color:var(--muted); }
  details.filters input { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); width:100%; }
  details.filters .pair { display:flex; gap:8px; }
  #report { display:none; margin-top:16px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); overflow-x:auto; }
  #report pre { margin:0; font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre-wrap; }
  .empty { padding:48px 16px; text-align:center; color:var(--muted); }
  #msg { min-height:20px; margin-top:12px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Datebot</h1>
  <div id="stats"></div>
  <a class="sm" href="/review" style="text-decoration:none">Review queue</a>
  <a class="sm" href="/insights" style="text-decoration:none">Insights</a>
  <a class="sm" href="/browse" style="text-decoration:none">Browse</a>
  <div class="row">
    <button class="sm" id="train">Train model</button>
    <button class="sm" id="evaluate">Evaluate</button>
    <button class="sm" id="resetModel">Reset model</button>
    <button class="sm" id="resetRatings">Reset ratings</button>
  </div>
</header>
<main>
  <div id="stage"></div>
  <div class="actions">
    <button id="pass">✕ Pass</button>
    <button id="like">♥ Like</button>
  </div>
  <div class="row"><button class="sm" id="undo">↶ Undo</button> <button class="sm" id="fake" title="Scam/fake: passes it and leaves it out of the insights stats">🚩 Fake (F)</button></div>
  <div class="hint">Keys: ← pass · → like · F fake · Z undo · ↑/↓ photos</div>
  <details class="filters">
    <summary>Deal-breakers <span id="hiddenCount" style="font-weight:400;color:var(--muted)"></span></summary>
    <div class="pair">
      <div style="flex:1"><label for="fMin">Min age</label><input id="fMin" type="number" min="18" max="99"></div>
      <div style="flex:1"><label for="fMax">Max age</label><input id="fMax" type="number" min="18" max="99"></div>
      <div style="flex:1"><label for="fDist">Max distance (km)</label><input id="fDist" type="number" min="1"></div>
    </div>
    <label for="fBlock">Reject if bio/prompts mention (comma-separated)</label>
    <input id="fBlock" type="text" placeholder="smoker, 420">
    <label for="fReq">Reject unless they mention one of (comma-separated)</label>
    <input id="fReq" type="text" placeholder="hiking, climbing">
    <div class="row" style="margin-top:10px"><button class="sm" id="saveFilters">Save filters</button></div>
    <div class="hint">Profiles missing an age or distance are never rejected on that basis.</div>
  </details>
  <div class="drop" id="drop">
    <div>Drop a profile's photos here to add them (or <label style="text-decoration:underline;cursor:pointer">browse<input id="file" type="file" accept="image/*" multiple hidden></label>)</div>
    <div><input id="name" type="text" placeholder="name"><input id="age" type="number" placeholder="age" min="18" max="99"><input id="bio" type="text" placeholder="bio" style="width:240px"></div>
  </div>
  <div id="report"><pre id="reportText"></pre></div>
  <div id="msg"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null, photoIdx = 0, busy = false;

const api = async (path, opts = {}) => {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
};
const post = (path, json) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: json ? JSON.stringify(json) : undefined });
const say = t => { $('msg').textContent = t; };

function renderStats(s) {
  $('stats').textContent = `${s.rated} rated (${s.likes}♥ / ${s.passes}✕) · ${s.unrated - s.hidden} left` + (s.auto_swiped ? ` · ${s.auto_swiped} auto-swiped` : '') + (s.models.length ? ` · model: ${s.models.join(', ')}` : ' · no model');
  $('hiddenCount').textContent = s.hidden ? `(${s.hidden} hidden)` : '';
}

const list = v => v.split(',').map(x => x.trim()).filter(Boolean);
const num = v => (v === '' ? null : Number(v));
async function loadFilters() {
  const f = await api('/api/filters');
  $('fMin').value = f.min_age ?? ''; $('fMax').value = f.max_age ?? ''; $('fDist').value = f.max_distance_km ?? '';
  $('fBlock').value = f.blocked_keywords.join(', '); $('fReq').value = f.required_keywords.join(', ');
}
$('saveFilters').onclick = async () => {
  try {
    const r = await api('/api/filters', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      min_age: num($('fMin').value), max_age: num($('fMax').value), max_distance_km: num($('fDist').value),
      blocked_keywords: list($('fBlock').value), required_keywords: list($('fReq').value) }) });
    say(`Filters saved. ${r.stats.hidden} profile(s) hidden.`);
    await load();
  } catch (e) { say(e.message); }
};

function render() {
  const stage = $('stage');
  stage.replaceChildren();
  const box = document.createElement('div');
  if (!current) {
    box.className = 'card empty';
    box.textContent = 'Nothing to rate. Add profiles below.';
    stage.append(box); return;
  }
  box.className = 'card';
  const photo = document.createElement('div'); photo.className = 'photo';
  const img = document.createElement('img'); img.src = current.photos[photoIdx]; img.alt = '';
  photo.append(img);
  if (current.photos.length > 1) {
    const dots = document.createElement('div'); dots.className = 'dots';
    current.photos.forEach((_, i) => { const d = document.createElement('i'); if (i === photoIdx) d.className = 'on'; dots.append(d); });
    const l = document.createElement('button'); l.className = 'nav l'; l.onclick = () => step(-1);
    const r = document.createElement('button'); r.className = 'nav r'; r.onclick = () => step(1);
    photo.append(dots, l, r);
  }
  const info = document.createElement('div'); info.className = 'info';
  if (current.score != null) { const s = document.createElement('span'); s.className = 'score'; s.textContent = Math.round(current.score); s.title = 'Model score (0-100)'; info.append(s); }
  const h = document.createElement('h2'); h.textContent = [current.name, current.age].filter(Boolean).join(', ') || `Profile #${current.id}`;
  info.append(h);
  if (current.bio) { const p = document.createElement('p'); p.textContent = current.bio; info.append(p); }
  box.append(photo, info); stage.append(box);
}

function step(d) {
  if (!current) return;
  photoIdx = (photoIdx + d + current.photos.length) % current.photos.length;
  render();
}

async function load() {
  const r = await api('/api/next');
  current = r.profile; photoIdx = 0;
  renderStats(r.stats); render();
}

async function rate(liked) {
  if (!current || busy) return;
  busy = true;
  try { await post('/api/rate', { profile_id: current.id, liked }); await load(); }
  catch (e) { say(e.message); }
  finally { busy = false; }
}

$('like').onclick = () => rate(true);
$('pass').onclick = () => rate(false);
$('fake').onclick = async () => {
  if (!current || busy) return;
  busy = true;
  try { await post('/api/fake', { profile_id: current.id, is_fake: true, and_pass: true }); await load(); say('Marked fake and passed.'); }
  catch (e) { say(e.message); }
  finally { busy = false; }
};
$('undo').onclick = async () => { try { await post('/api/undo'); await load(); } catch (e) { say(e.message); } };
$('train').onclick = async () => {
  say('Embedding photos and training…');
  try {
    const r = await post('/api/train');
    say(`Trained on ${r.n_samples} ratings` + (r.cv_accuracy != null ? ` · cross-val accuracy ${Math.round(r.cv_accuracy * 100)}%` : ''));
    await load();
  } catch (e) { say(e.message); }
};
$('evaluate').onclick = async () => {
  const box = $('report');
  try {
    const r = await api('/api/eval');
    $('reportText').textContent = r.text;
    box.style.display = 'block';
    box.scrollIntoView({ behavior: 'smooth' });
    say(`Evaluated ${r.n} ratings.`);
  } catch (e) { box.style.display = 'none'; say(e.message); }
};
$('resetModel').onclick = async () => {
  if (!confirm('Forget the trained model? (Ratings are kept.)')) return;
  await post('/api/reset-model'); say('Model reset.'); await load();
};
$('resetRatings').onclick = async () => {
  if (!confirm('Delete ALL ratings and start teaching from scratch?')) return;
  const r = await post('/api/reset-ratings'); say(`Deleted ${r.deleted} ratings.`); await load();
};

addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight') rate(true);
  else if (e.key === 'ArrowLeft') rate(false);
  else if (e.key === 'ArrowUp') step(-1);
  else if (e.key === 'ArrowDown') step(1);
  else if (e.key.toLowerCase() === 'f') $('fake').click();
  else if (e.key.toLowerCase() === 'z') $('undo').click();
});

async function upload(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return say('No images found.');
  const fd = new FormData();
  imgs.forEach(f => fd.append('photos', f));
  for (const k of ['name', 'age', 'bio']) if ($(k).value) fd.append(k, $(k).value);
  try {
    await api('/api/profiles', { method: 'POST', body: fd });
    ['name', 'age', 'bio'].forEach(k => { $(k).value = ''; });
    say(`Added profile with ${imgs.length} photo(s).`);
    if (!current) await load(); else renderStatsOnly();
  } catch (e) { say(e.message); }
}
async function renderStatsOnly() { renderStats((await api('/api/next')).stats); }

const drop = $('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload(e.dataTransfer.files));
$('file').onchange = e => upload(e.target.files);

load().catch(e => say(e.message));
loadFilters().catch(() => {});
</script>
</body>
</html>
